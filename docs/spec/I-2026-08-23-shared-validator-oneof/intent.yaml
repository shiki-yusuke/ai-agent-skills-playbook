premise_evidence:
  required: true
  method: live
  reproduced: true
  evidence: "2026-08-23 に実機で再現済み: lane_ref: 42 に改変した release-evidence bundle (digest は実計算で整合) が shared validator の schema 検証を通過することを、release-approval の composite fixture への改変注入 (MV-05) と sol architect レビュー3巡目の独立指摘の両方で確認。原因は validateAgainst が oneOf keyword を評価しないこと。oneOf の実使用箇所は grep で release-evidence の2 schema (release-evidence-bundle.schema.json の lane_ref/review、release-event.schema.json) のみと確認済み" 
