test_gaps:
  - taxonomy: compatibility_missed
    description: $ref の early return が assertion sibling を評価しない (draft 2020-12
      は許容)。現 repo の使用範囲は description sibling のみで実害なし。subset 境界の明記 or 解消は別 lane
      (sol ask)
    location: contracts/shared/schema-validator.mjs
    priority: low
  - taxonomy: lifecycle_missed
    description: vendored copy (lane repo 等) は commit pin のため oneOf 未評価のまま。再 vendor
      タスクを tasks.md に owner・期限付きで登録済み
    priority: medium
manual_verification:
  - id: MV-01
    description: oneOf 評価を一時無効化 (schema.oneOf → __disabled_oneOf) して selftest を実行
    expected_status: fail する (空回りでないことを builder と team-lead が独立に確認、2026-08-23)
