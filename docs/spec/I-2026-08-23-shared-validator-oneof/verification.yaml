success_criteria_matrix:
  - criterion: contracts/shared/schema-validator.mjs が JSON Schema 2020-12 の oneOf
      を評価する (ちょうど1つの subschema に一致しなければ invalid、0件・2件以上一致はいずれも invalid)
    covered_by: test
    evidence: selftest の exactly-one / zero-match / multi-match ケース。sol が draft
      2020-12 の oneOf 定義 (json-schema.org 一次資料) と照合し整合を確認
    negation_test: zero-match / multi-match ケースが invalid になる。oneOf 無効化で selftest が
      fail (MV-01)
  - criterion: "lane_ref: 42 または review: 42 を含む release-evidence bundle が shared
      validator 単体で invalid になり、その検証が自動 self-test として CI 経路で実行される"
    covered_by: test
    evidence: selftest の実 schema 回帰ケース (lane_ref:42 / review:42 → invalid) +
      repo-checks.mjs への配線 (CI は repo-checks を実行するため自動搭載)
    negation_test: oneOf 無効化でこの回帰ケースが fail する (MV-01 で実証)
  - criterion: 全13契約の verify-fixtures.mjs と contracts/shared/repo-checks.mjs が変更後も
      exit 0 で、既存 fixture の期待結果 (accept/invalid/reject) が1件も変わらない
    covered_by: test
    evidence: 変更前後で PASS 件数完全一致 (promotion-receipt 21/21 / release-approval 45/45 /
      release-evidence 40/40 等) を builder と team-lead が独立に確認
    negation_test: 期待結果が変わった場合は fixture でなく実装の bug として扱う規律を spec に明記 (変わらなかったので発火せず)
  - criterion: 非一致分岐の試行エラーが呼び出し側のエラーリストに漏れない (oneOf の trial evaluation は隔離される)
    covered_by: test
    evidence: selftest のエラー隔離ケース (非一致分岐の 'expected type' 文言が結果に混入しないことを検証)
    negation_test: 隔離を外すと当該ケースが fail する構造 (漏れ文言の不在を明示的に assert)
