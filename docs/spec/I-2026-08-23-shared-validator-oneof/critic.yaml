schema_version: "1.0"
intent_id: I-2026-08-23-shared-validator-oneof
decision: pass
confidence: high
per_lens:
  - lens_id: lifecycle_management
    result: applicable
    finding: "凍結済み契約 (release-evidence/v0 は FROZEN) の検証が事後に厳格化される。判断根拠 (sol レビューで明文化): 凍結対象は schema/protocol/fixtures であり、それらは本変更で不変。本変更は『既存実装 (validator) の過少検証を凍結済み正本へ一致させる修正』なので freeze 規律に反しない。期待結果が変わらないこと (R6) が回帰条件で、変わった場合は fixture 側でなく実装の bug として扱う"
    taxonomy: compatibility_missed
    evidence: "release-evidence の全40 fixture は凍結時点で oneOf 分岐に正しく一致している想定。R5(e) + R6 が実測で確認する"
    knowledge_candidates: []
  - lens_id: error_handling
    result: applicable
    finding: "oneOf の失敗時、どの分岐がなぜ落ちたかの詳細を出さない設計 (matched N のみ)。デバッグ性は劣るが、非一致分岐のエラー漏れ防止 (R2) を優先。既存 if/not と同じトレードオフ"
    taxonomy: observability_gap
    evidence: "既存 not keyword も同様に詳細を出さない。一貫性を優先"
    knowledge_candidates: []
  - lens_id: security
    result: not_applicable
    knowledge_candidates: []
  - lens_id: performance
    result: not_applicable
    knowledge_candidates: []
  - lens_id: a11y
    result: not_applicable
    knowledge_candidates: []
  - lens_id: i18n
    result: not_applicable
    knowledge_candidates: []
  - lens_id: architecture
    result: applicable
    finding: "validator は『この repo の schema が使う subset そのもの』という設計原則 (冒頭コメント) を持つ。oneOf 追加は使用実態 (release-evidence 2箇所) に合致し原則内。anyOf を同時に足さないのはこの原則の適用 (使用ゼロ)"
    taxonomy: architecture_violation
    evidence: "schema-validator.mjs:1-10 の設計宣言。grep で anyOf 使用ゼロを確認済み"
    knowledge_candidates: []
  - lens_id: test_coverage
    result: applicable
    finding: "独立再探索: oneOf 追加で挙動が変わりうるのは oneOf を含む schema だけだが、$ref 経由で release-evidence schema を参照する他契約があれば波及する。grep では release-approval の composite verifier が release-evidence schema を直接 createValidator で読む (F lane で追加した embed 検証)。ここも厳格化の影響先なので R6 の全回帰に含まれることを確認する"
    taxonomy: test_missing
    evidence: "release-approval/v0/verify-fixtures.mjs の embed bundle 検証 (F lane commit 1db7a1a)"
    knowledge_candidates: []
  - lens_id: documentation
    result: applicable
    finding: "冒頭のサポート keyword 一覧が実装と乖離すると『何が検証されるか』の契約が嘘になる (今回の欠陥もこの一覧に oneOf が無いのに schema が使っていたのが根)。R4 で一覧更新を必須化"
    taxonomy: wrong_assumption
    evidence: "schema-validator.mjs:1-10"
    knowledge_candidates: []
