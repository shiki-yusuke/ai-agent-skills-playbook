open_questions:
  - "lane repo 等に vendor 済みの validator copy は commit pin のため本変更後も oneOf 未対応のまま。再 vendor のタイミング (UPSTREAM 手順) は別タスク (owner と時期を tasks.md に固定済み)"
  - "$ref の early return は assertion sibling を評価しない (draft 2020-12 は $ref sibling を許容)。現 repo の使用範囲は description のみのため実害なし。subset 境界の明記 or 解消は別 lane 判断 (sol ask)"
