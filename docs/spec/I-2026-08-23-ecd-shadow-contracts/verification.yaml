success_criteria_matrix:
  - criterion: 3契約それぞれに schema + valid/invalid fixtures + verify-fixtures.mjs
      が存在し、node verify-fixtures.mjs が3契約すべてで exit 0 で通る
    covered_by: test
    evidence: contracts/{review-findings/v1,promotion-receipt/v0,release-approval/v0}/
      に schema+fixtures+verifier。25/21/45 fixtures 全 PASS、repo-checks も exit 0
    negation_test: MV-01〜05 の改変注入で verifier が exit 非0 になることを実機確認 (通るだけの verifier ではない)
  - criterion: replay fixture で none_observed_in_recorded_scope の走査scope欠落 /
      authority 不足 / digest mismatch / contradiction / applicable unknown の
      abstain 化の5系統が invalid または reject として検出される
    covered_by: test
    evidence: ①invalid-none-observed-empty-{paths,lenses}
      ②reject-composite-approval-granted-non-ready-receipt (authority 不足 = 非
      ready への通常承認) ③reject-composite-fake-receipt-digest /
      reject-composite-stale-bundle-digest
      ④reject-contradicted-but-verdict-abstained
      ⑤reject-unknown-but-verdict-ready
    negation_test: 各系統の reject/invalid fixture 自体が負例 (expected-results.json で期待
      reject/invalid を宣言し、verifier が accept したら fixture 検証が fail する構造)
  - criterion: promotion-receipt の verdict は ready_for_approval|ineligible|abstained
      のみで eligible を持たず、human_release_approval を述語として評価しない (authority 循環の排除)
    covered_by: test
    evidence: schema の verdict enum は3値のみ (grep で eligible 不在を確認)。predicate_id enum
      に human_release_approval 不在 + schema description に意図を明記
    negation_test: invalid-predicate-human-release-approval.json が schema レベルで invalid になる
  - criterion: 個人次元 scan (contracts/shared/personal-dimensions.mjs) が3契約の verifier
      に配線され、reviewer/approver に人名・実行IDを含む fixture が拒否される
    covered_by: test
    evidence: 3 verifier とも scanPersonalDimensions を全 fixture に適用。なお契約フィールド名は禁止キー
      reviewer との衝突回避のため assessor (spec.md Revision 2 に記録)
    negation_test: reject-personal-dimension-in-params.json /
      invalid-principal-id-with-at-sign.json が拒否される
  - criterion: 数値 confidence フィールドが3契約の schema のどこにも存在しない
    covered_by: test
    evidence: grep で3 schema に confidence キー不在を確認 + 3 verifier に lowercase 包含一致の
      confidence scan (防御的)
    negation_test: invalid-additional-property-confidence.json /
      reject-numeric-confidence-in-params.json が拒否される
  - criterion: 凍結事項 (KPI 母数・期間・FP 判定者 / H 起動条件の証拠源 / 外部根拠の出典・日付・適用範囲) が
      docs/evidence-closed-delivery-frozen-decisions.md に記録される
    covered_by: diff
    evidence: docs/evidence-closed-delivery-frozen-decisions.md に全項目を記録
      (正本プランから転記、ベースライン凍結値込み)
    negation_test: 機械的負例なし (文書要件)。各項目の存在は目視確認済み (test_matrix R20 行)
cross_check_intent_vs_spec:
  performed_at: 2026-08-23 (Phase 3)
  finding: 方向②の点検で spec.md Revision 2 (R21-R24) が intent.success より強い条件
    (述語完全性・approval の ready 限定・record_digest 束縛・重複 event reject)
    を定めていることを確認。ただしこれらは sol レビューが要求した実装上の強化であり、intent.success
    の6条件はその弱い側の含意として全て満たされる。intent.yaml の success を書き換える必要なし (SSOT の条件はすべて diff
    で成立)。逆方向①も1行ずつ突合済み (success_criteria_matrix)
