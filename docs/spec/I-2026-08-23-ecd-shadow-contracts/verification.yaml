schema_version: "1.0"
intent_id: I-2026-08-23-ecd-shadow-contracts
test_matrix:
  - ears_rule: Rule R1-R7 (review-findings/v1 schema + semantic)
    test_type: unit
    test_file: contracts/review-findings/v1/verify-fixtures.mjs
    test_name: fixtures 25/25 (accept/invalid/reject)
    status: added
    note: "outcome 3値の相互制約、assessor 制約、locations 整合、実在日時、個人次元/confidence
      scan。【訂正 2026-08-27】実件数は 23/23（verify-fixtures.mjs 実行で確認、terra が
      release-evidence-shadow 実装レビュー中に発見）。25 は記録時の誤記で、原文は履歴保全のため
      残す。digest 束縛 ack は記録当時の内容に対するもの"
  - ears_rule: Rule R8-R13, R21 (promotion-receipt/v0 schema + verdict 導出 + 述語完全性 +
      semantic_digest)
    test_type: unit
    test_file: contracts/promotion-receipt/v0/verify-fixtures.mjs
    test_name: fixtures 21/21
    status: added
    note: checkPredicateCompleteness (pre 6述語/post 1述語・重複拒否・常設 applicable
      強制)、verdict 導出一致、semantic_digest 再計算、resolvable evidence kind
  - ears_rule: Rule R14-R19, R22-R24 (release-approval/v0 event + composite cross-record)
    test_type: unit
    test_file: contracts/release-approval/v0/verify-fixtures.mjs
    test_name: fixtures 45/45 (composite 含む)
    status: added
    note: event_id/receipt_digest/record_digest 再計算、embed bundle の
      schema+union+個人次元検証、revocation 4経路、R22 (approval は ready_for_approval
      のみ)、anchor 規則
  - ears_rule: Rule R20 (凍結事項ドキュメント)
    test_type: manual
    test_file: docs/evidence-closed-delivery-frozen-decisions.md
    status: added
    note: KPI 母数・期間・FP 判定者 / H 起動条件と証拠源 / I 解禁数値表 / 外部根拠の出典・日付・適用範囲 / 運用上限・縮退順序 /
      ベースライン凍結値の存在を目視確認
  - ears_rule: 回帰 (既存契約への影響なし)
    test_type: regression
    test_file: contracts/shared/repo-checks.mjs
    test_name: 全13契約 verify-fixtures + repo-checks
    status: existing
    note: CI と同一の discovery 方式でローカル実行、全 exit 0
test_gaps:
  - taxonomy: observability_gap
    description: 自由文フィールド (claim/notes) への個人情報の value レベル混入は機械検出不能。protocol doc の
      normative MUST + レビュー規律で対処 (critic.yaml security lens 参照)
    priority: medium
  - taxonomy: compatibility_missed
    description: contracts/shared/schema-validator.mjs が oneOf を評価しない (sol 3巡目で発見)。本
      lane は release-approval verifier 内の union 補完で対処したが、shared validator の
      oneOf 対応は別タスク (全契約横断)
    location: contracts/shared/schema-validator.mjs
    priority: high
  - taxonomy: missing_state
    description: selection_manifest_digest の指す selection manifest 契約が未定義。v0 draft では
      opaque digest + caveat (protocol doc に明記)
    priority: medium
manual_verification:
  - id: MV-01
    description: "改変注入: composite の receipt_digest / receipt_semantic_digest /
      event_id をそれぞれ1文字改変"
    expected_status: 3件とも verifier が exit 非0 で検出 (2026-08-23 実施済み)
  - id: MV-02
    description: "改変注入: composite 内 finding の claim 差し替え (record_digest 束縛の確認)"
    expected_status: 検出 (2026-08-23 実施済み)
  - id: MV-03
    description: "改変注入: accept receipt から述語を1つ削除 (R21 完全性)"
    expected_status: 検出 (2026-08-23 実施済み)
  - id: MV-04
    description: "改変注入: 相互一致するが embed bundle に解決しない bundle_digest (must-2 の穴の再現)"
    expected_status: 検出 (2026-08-23 実施済み)
  - id: MV-05
    description: "改変注入: digest 整合済みの union 違反 bundle (lane_ref: 42) の embed"
    expected_status: 検出 (2026-08-23 実施済み)
goal_stopping_condition:
  - 全13契約の verify-fixtures.mjs + repo-checks.mjs が exit 0
  - sol architect レビューの must が全て解消し最終 gate PASS (5巡目 2026-08-23)
  - 改変注入テスト MV-01〜05 が全て検出側に倒れる
